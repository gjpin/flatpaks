app-id: "org.citronemu.Citron"
runtime: "org.freedesktop.Platform"
runtime-version: "25.08"
sdk: "org.freedesktop.Sdk"

command: "citron"

finish-args:
  - "--device=all"
  - "--allow=bluetooth"
  - "--share=network"
  - "--share=ipc"
  - "--socket=pulseaudio"
  - "--talk-name=org.freedesktop.ScreenSaver"
  - "--socket=wayland"
  - "--socket=fallback-x11"

modules:
  - name: citron
    buildsystem: simple
    sources:
      - type: file
        path: Citron-x64.AppImage
    build-options:
      strip: false
      no-debuginfo: true
    build-commands:
      - "chmod +x Citron-x64.AppImage"
      - "./Citron-x64.AppImage --appimage-extract"
      - "mv squashfs-root/usr/* \"${FLATPAK_DEST}/\""
      - "rm -fr squashfs-root"