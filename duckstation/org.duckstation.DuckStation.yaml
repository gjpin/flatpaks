# Updated from:
# https://github.com/stenzek/duckstation/blob/master/scripts/packaging/flatpak/org.duckstation.DuckStation.yaml

app-id: "org.duckstation.DuckStation"
runtime: "org.freedesktop.Platform"
runtime-version: "25.08"
sdk: "org.freedesktop.Sdk"
sdk-extensions:
  - "org.freedesktop.Sdk.Extension.llvm21"

command: "duckstation-qt"

finish-args:
  - "--device=all"
  - "--allow=bluetooth"
  - "--share=network"
  - "--share=ipc"
  - "--socket=pulseaudio"
  - "--talk-name=org.freedesktop.ScreenSaver"
  - "--socket=wayland"
  - "--socket=fallback-x11"

modules:
  - name: duckstation
    buildsystem: simple
    sources:
      - type: file
        path: DuckStation.AppImage
    build-options:
      strip: false
      no-debuginfo: true
    build-commands:
      - "chmod +x DuckStation.AppImage"
      - "./DuckStation.AppImage --appimage-extract"
      - "mv squashfs-root/usr/* \"${FLATPAK_DEST}/\""
      - "rm -fr squashfs-root"